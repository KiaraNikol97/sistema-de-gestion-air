<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Votaciones - AIR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f5f7fb; }
        .votacion-card { border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 25px; overflow: hidden; }
        .votacion-header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 20px; }
        .votacion-body { padding: 25px; background: white; }
        .resultado-aprobado { background-color: #28a745; color: white; padding: 10px 20px; border-radius: 30px; display: inline-block; }
        .resultado-rechazado { background-color: #dc3545; color: white; padding: 10px 20px; border-radius: 30px; display: inline-block; }
        .resultado-pendiente { background-color: #ffc107; color: #333; padding: 10px 20px; border-radius: 30px; display: inline-block; }
        .badge-simple { background-color: #17a2b8; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; }
        .badge-calificada { background-color: #fd7e14; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; }
        .voto-btn { padding: 5px 12px; margin: 0 3px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
        .voto-favor-btn { background-color: #d4edda; color: #155724; border: 1px solid #28a745; }
        .voto-favor-btn:hover, .voto-favor-btn.selected { background-color: #28a745; color: white; }
        .voto-contra-btn { background-color: #f8d7da; color: #721c24; border: 1px solid #dc3545; }
        .voto-contra-btn:hover, .voto-contra-btn.selected { background-color: #dc3545; color: white; }
        .voto-abstencion-btn { background-color: #e2e3e5; color: #383d41; border: 1px solid #6c757d; }
        .voto-abstencion-btn:hover, .voto-abstencion-btn.selected { background-color: #6c757d; color: white; }
        .voto-pendiente { color: #ffc107; font-style: italic; }
        .voto-emitido-favor { color: #28a745; font-weight: bold; }
        .voto-emitido-contra { color: #dc3545; font-weight: bold; }
        .voto-emitido-abstencion { color: #6c757d; font-weight: bold; }
        .loading { display: none; text-align: center; padding: 50px; }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>
    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4"><h1><i class="fas fa-vote-yea me-2"></i>Tablero de Votaciones</h1></div>
        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-5 mb-3">
                        <label class="form-label fw-bold"><i class="fas fa-calendar-alt me-1"></i> Sesión</label>
                        <select id="sesion-select" class="form-select">
                            <option value="">-- Cargando sesiones... --</option>
                        </select>
                    </div>
                    <div class="col-md-5 mb-3">
                        <label class="form-label fw-bold"><i class="fas fa-file-alt me-1"></i> Votación</label>
                        <select id="votacion-select" class="form-select">
                            <option value="">-- Primero seleccione una sesión --</option>
                        </select>
                    </div>
                    <div class="col-md-2 mb-3 d-flex align-items-end">
                        <button id="btn-cargar" class="btn btn-primary w-100"><i class="fas fa-search me-1"></i> Cargar</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="loading" class="loading"><div class="spinner-border text-primary" role="status"></div><p class="mt-2">Cargando información...</p></div>
        
        <div id="votacion-panel" style="display: none;">
            <div class="votacion-card">
                <div class="votacion-header">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h3 id="propuesta-titulo" class="mb-1">-</h3>
                            <small id="propuesta-descripcion">-</small>
                        </div>
                        <div class="col-md-4 text-md-end">
                            <span id="mayoria-badge" class="badge-simple">-</span>
                        </div>
                    </div>
                </div>
                <div class="votacion-body">
                    <div class="row text-center mb-4">
                        <div class="col-md-3"><div class="border rounded p-3"><small class="text-muted">Total Asambleístas</small><h2 id="total-count" class="mb-0">0</h2></div></div>
                        <div class="col-md-3"><div class="border rounded p-3"><small class="text-muted">Votos Favor</small><h2 id="favor-count" class="mb-0 text-success">0</h2></div></div>
                        <div class="col-md-3"><div class="border rounded p-3"><small class="text-muted">Votos Contra</small><h2 id="contra-count" class="mb-0 text-danger">0</h2></div></div>
                        <div class="col-md-3"><div class="border rounded p-3"><small class="text-muted">Abstenciones</small><h2 id="abstencion-count" class="mb-0 text-warning">0</h2></div></div>
                    </div>
                    <div class="text-center mb-4"><span id="resultado-badge" class="resultado-pendiente"><i class="fas fa-hourglass-half me-1"></i> Pendiente de votación</span></div>
                    <div class="text-center mb-4">
                        <button class="btn btn-danger" onclick="finalizarVotacion()"><i class="fas fa-check-circle me-2"></i> Finalizar Votación</button>
                        <button class="btn btn-secondary ms-2" onclick="reiniciarVotacion()"><i class="fas fa-undo me-2"></i> Reiniciar Votación</button>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header bg-white fw-bold">
                    <i class="fas fa-users me-1"></i> Registro de Votación Individual
                    <small class="text-muted ms-2">(Cada asambleísta debe emitir su voto)</small>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr><th>ID</th><th>Asambleísta</th><th>Sector</th><th colspan="3" class="text-center">Voto</th><th>Estado</th></tr>
                                <tr class="table-secondary">
                                    <th colspan="3"></th>
                                    <th class="text-center text-success">A Favor</th>
                                    <th class="text-center text-danger">En Contra</th>
                                    <th class="text-center text-warning">Abstención</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="votos-detalle-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="footer-placeholder"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // =====================================================
        // VOTACIONES CONECTADAS A LA BASE DE DATOS
        // =====================================================
        
        let currentVotacionId = null;
        let currentPropuesta = null;
        let asambleistasReales = [];
        let votos = { favor: 0, contra: 0, abstencion: 0 };
        let votosAsambleistas = {};

        function loadSharedComponents() {
            fetch('/views/shared/navbar.view.html')
                .then(res => res.text())
                .then(data => document.getElementById('navbar-placeholder').innerHTML = data)
                .catch(() => document.getElementById('navbar-placeholder').innerHTML = '<nav class="navbar navbar-dark bg-dark p-3"><a class="navbar-brand" href="#">AIR - Votaciones</a></nav>');
            fetch('/views/shared/footer.view.html')
                .then(res => res.text())
                .then(data => document.getElementById('footer-placeholder').innerHTML = data)
                .catch(() => document.getElementById('footer-placeholder').innerHTML = '<footer class="text-center text-muted py-3 mt-4 border-top"><small>Asamblea Institucional Representativa - TEC</small></footer>');
        }

        function showError(message) {
            alert( message);
        }

        function showSuccess(message) {
            alert( message);
        }

        // Cargar sesiones desde la BD
        async function cargarSesiones() {
            const select = document.getElementById('sesion-select');
            select.innerHTML = '<option value="">-- Cargando sesiones... --</option>';
            try {
                const response = await fetch('/api/sesiones');
                const result = await response.json();
                if (result.success && result.data && result.data.length > 0) {
                    select.innerHTML = '<option value="">-- Seleccionar sesión --</option>';
                    result.data.forEach(s => {
                        select.innerHTML += `<option value="${s.id_sesion}">${s.numero_sesion} - ${s.tipo_sesion} (${new Date(s.fecha).toLocaleDateString()})</option>`;
                    });
                } else {
                    select.innerHTML = '<option value="">-- No hay sesiones registradas --</option>';
                }
            } catch (error) {
                console.error('Error cargando sesiones:', error);
                select.innerHTML = '<option value="">-- Error al cargar sesiones --</option>';
            }
        }

        // Cargar votaciones de una sesión
        async function cargarVotaciones(sesionId) {
            const select = document.getElementById('votacion-select');
            select.innerHTML = '<option value="">-- Cargando votaciones... --</option>';
            try {
                const response = await fetch(`/api/votaciones?id_sesion=${sesionId}`);
                const result = await response.json();
                if (result.success && result.data && result.data.length > 0) {
                    select.innerHTML = '<option value="">-- Seleccionar votación --</option>';
                    result.data.forEach(v => {
                        select.innerHTML += `<option value="${v.id_votacion}">${v.numero_votacion || 'Votación'} - ${v.resultado || 'Pendiente'}</option>`;
                    });
                } else {
                    select.innerHTML = '<option value="">-- No hay votaciones en esta sesión --</option>';
                }
            } catch (error) {
                console.error('Error cargando votaciones:', error);
                select.innerHTML = '<option value="">-- Error al cargar votaciones --</option>';
            }
        }

        // Cargar asambleístas desde la BD
        async function cargarAsambleistasReales() {
            try {
                const response = await fetch('/api/asambleistas');
                const result = await response.json();
                if (result.success && result.data) {
                    asambleistasReales = result.data.map(a => ({
                        id: a.id_asambleista,
                        cedula: a.cedula,
                        nombre: a.nombre,
                        sector: 'Por definir'
                    }));
                } else {
                    asambleistasReales = [];
                }
            } catch (error) {
                console.error('Error cargando asambleístas:', error);
                asambleistasReales = [];
            }
        }

        // Cargar una votación específica
        async function cargarVotacion() {
            const votacionId = document.getElementById('votacion-select').value;
            if (!votacionId) return;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('votacion-panel').style.display = 'none';
            
            try {
                const response = await fetch(`/api/votaciones/${votacionId}`);
                const result = await response.json();
                
                if (result.success && result.data) {
                    const data = result.data;
                    currentVotacionId = data.id_votacion;
                    
                    document.getElementById('propuesta-titulo').innerText = data.numero_votacion || 'Votación';
                    document.getElementById('propuesta-descripcion').innerText = data.tipo_votacion || 'Pública';
                    document.getElementById('total-count').innerText = asambleistasReales.length;
                    
                    const mayoriaBadge = document.getElementById('mayoria-badge');
                    if (data.tipo_mayoria === 'Calificada') {
                        mayoriaBadge.className = 'badge-calificada';
                        mayoriaBadge.innerHTML = 'Mayoría Calificada (66%)';
                    } else {
                        mayoriaBadge.className = 'badge-simple';
                        mayoriaBadge.innerHTML = 'Mayoría Simple (50%+1)';
                    }
                    
                    // Cargar votos existentes
                    await cargarVotosExistentes(votacionId);
                    
                    reiniciarVotacion();
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('votacion-panel').style.display = 'block';
                } else {
                    showError('No se encontraron datos de la votación');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Error al cargar la votación');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function cargarVotosExistentes(votacionId) {
            try {
                const response = await fetch(`/api/votaciones/${votacionId}`);
                const result = await response.json();
                if (result.success && result.data) {
                    // Aquí podrías cargar los votos individuales si existen
                }
            } catch (error) {
                console.error('Error cargando votos:', error);
            }
        }

        function registrarVoto(asambleistaId, tipoVoto) {
            if (!currentVotacionId) {
                showError('No hay votación seleccionada');
                return;
            }
            
            const votoAnterior = votosAsambleistas[asambleistaId];
            if (votoAnterior) votos[votoAnterior]--;
            
            votosAsambleistas[asambleistaId] = tipoVoto;
            votos[tipoVoto]++;
            
            actualizarContadores();
            actualizarFilaVoto(asambleistaId, tipoVoto);
            calcularResultado();
            
            // Enviar voto a la BD
            enviarVoto(asambleistaId, tipoVoto);
        }

        async function enviarVoto(asambleistaId, tipoVoto) {
            try {
                const response = await fetch(`/api/votaciones/${currentVotacionId}/voto`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo_voto: tipoVoto === 'favor' ? 'Favor' : tipoVoto === 'contra' ? 'Contra' : 'Abstencion' })
                });
                const result = await response.json();
                if (!result.success) {
                    console.error('Error enviando voto:', result.message);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function actualizarContadores() {
            document.getElementById('favor-count').innerText = votos.favor;
            document.getElementById('contra-count').innerText = votos.contra;
            document.getElementById('abstencion-count').innerText = votos.abstencion;
        }

        function calcularResultado() {
            const totalEmitidos = votos.favor + votos.contra + votos.abstencion;
            const resultadoSpan = document.getElementById('resultado-badge');
            
            if (totalEmitidos < asambleistasReales.length) {
                resultadoSpan.className = 'resultado-pendiente';
                resultadoSpan.innerHTML = `<i class="fas fa-hourglass-half me-1"></i> Pendiente - Faltan ${asambleistasReales.length - totalEmitidos} asambleísta(s) por votar`;
                return;
            }
            
            let aprobado = false;
            const mayoriaBadge = document.getElementById('mayoria-badge');
            const esCalificada = mayoriaBadge.classList.contains('badge-calificada');
            
            if (esCalificada) {
                const votosValidos = votos.favor + votos.contra;
                if (votosValidos > 0) {
                    aprobado = (votos.favor / votosValidos) >= 0.66;
                }
            } else {
                aprobado = votos.favor > votos.contra;
            }
            
            if (aprobado) {
                resultadoSpan.className = 'resultado-aprobado';
                resultadoSpan.innerHTML = '<i class="fas fa-check-circle me-1"></i> APROBADA - La propuesta ha sido aprobada';
            } else {
                resultadoSpan.className = 'resultado-rechazado';
                resultadoSpan.innerHTML = '<i class="fas fa-times-circle me-1"></i> RECHAZADA - La propuesta no alcanzó los votos necesarios';
            }
        }

        function actualizarFilaVoto(asambleistaId, tipoVoto) {
            const row = document.querySelector(`tr[data-id="${asambleistaId}"]`);
            if (row) {
                const estadoSpan = row.querySelector('.estado-voto');
                if (tipoVoto === 'favor') estadoSpan.innerHTML = '<span class="voto-emitido-favor">✅ Votó a favor</span>';
                else if (tipoVoto === 'contra') estadoSpan.innerHTML = '<span class="voto-emitido-contra">❌ Votó en contra</span>';
                else estadoSpan.innerHTML = '<span class="voto-emitido-abstencion">⏸ Se abstuvo</span>';
            }
        }

        function cargarDetalleVotos() {
            const tbody = document.getElementById('votos-detalle-tbody');
            tbody.innerHTML = '';
            
            if (asambleistasReales.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No hay asambleístas registrados</td></tr>';
                return;
            }
            
            asambleistasReales.forEach(a => {
                const votoActual = votosAsambleistas[a.id];
                const row = tbody.insertRow();
                row.setAttribute('data-id', a.id);
                row.insertCell(0).innerText = a.id;
                row.insertCell(1).innerText = a.nombre;
                row.insertCell(2).innerText = a.sector;
                
                const celFavor = row.insertCell(3);
                const btnFavor = document.createElement('button');
                btnFavor.className = `voto-btn voto-favor-btn ${votoActual === 'favor' ? 'selected' : ''}`;
                btnFavor.innerHTML = ' Favor';
                btnFavor.onclick = () => registrarVoto(a.id, 'favor');
                celFavor.appendChild(btnFavor);
                celFavor.className = 'text-center';
                
                const celContra = row.insertCell(4);
                const btnContra = document.createElement('button');
                btnContra.className = `voto-btn voto-contra-btn ${votoActual === 'contra' ? 'selected' : ''}`;
                btnContra.innerHTML = ' Contra';
                btnContra.onclick = () => registrarVoto(a.id, 'contra');
                celContra.appendChild(btnContra);
                celContra.className = 'text-center';
                
                const celAbstencion = row.insertCell(5);
                const btnAbstencion = document.createElement('button');
                btnAbstencion.className = `voto-btn voto-abstencion-btn ${votoActual === 'abstencion' ? 'selected' : ''}`;
                btnAbstencion.innerHTML = ' Abstención';
                btnAbstencion.onclick = () => registrarVoto(a.id, 'abstencion');
                celAbstencion.appendChild(btnAbstencion);
                celAbstencion.className = 'text-center';
                
                const celEstado = row.insertCell(6);
                let estadoHtml = '';
                if (!votoActual) estadoHtml = '<span class="voto-pendiente"> Pendiente</span>';
                else if (votoActual === 'favor') estadoHtml = '<span class="voto-emitido-favor">✅ Votó a favor</span>';
                else if (votoActual === 'contra') estadoHtml = '<span class="voto-emitido-contra">❌ Votó en contra</span>';
                else estadoHtml = '<span class="voto-emitido-abstencion">⏸ Se abstuvo</span>';
                celEstado.innerHTML = estadoHtml;
                celEstado.className = 'estado-voto';
            });
        }

        async function finalizarVotacion() {
            const totalEmitidos = votos.favor + votos.contra + votos.abstencion;
            
            if (totalEmitidos < asambleistasReales.length) {
                alert(` No se puede finalizar. Faltan ${asambleistasReales.length - totalEmitidos} asambleísta(s) por votar.`);
                return;
            }
            
            try {
                const response = await fetch(`/api/votaciones/${currentVotacionId}/finalizar`, {
                    method: 'POST'
                });
                const result = await response.json();
                
                if (result.success) {
                    const resultadoSpan = document.getElementById('resultado-badge');
                    const esAprobada = resultadoSpan.classList.contains('resultado-aprobado');
                    alert(` VOTACIÓN FINALIZADA\n\nResultado: ${esAprobada ? 'APROBADA' : 'RECHAZADA'}\n\nVotos a favor: ${votos.favor}\nVotos en contra: ${votos.contra}\nAbstenciones: ${votos.abstencion}`);
                    
                    // Recargar votación para mostrar resultado final
                    await cargarVotacion();
                } else {
                    showError(result.message || 'Error al finalizar');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Error al finalizar la votación');
            }
        }

        function reiniciarVotacion() {
            votos = { favor: 0, contra: 0, abstencion: 0 };
            votosAsambleistas = {};
            asambleistasReales.forEach(a => { votosAsambleistas[a.id] = null; });
            actualizarContadores();
            cargarDetalleVotos();
            const resultadoSpan = document.getElementById('resultado-badge');
            resultadoSpan.className = 'resultado-pendiente';
            resultadoSpan.innerHTML = `<i class="fas fa-hourglass-half me-1"></i> Pendiente - Faltan ${asambleistasReales.length} asambleísta(s) por votar`;
        }

        document.getElementById('sesion-select').addEventListener('change', function() {
            const sesionId = this.value;
            if (sesionId) {
                cargarVotaciones(sesionId);
            } else {
                document.getElementById('votacion-select').innerHTML = '<option value="">-- Primero seleccione una sesión --</option>';
            }
        });

        document.getElementById('btn-cargar').addEventListener('click', cargarVotacion);

        async function init() {
            await loadSharedComponents();
            await cargarAsambleistasReales();
            await cargarSesiones();
        }
        
        init();
    </script>
</body>
</html>
