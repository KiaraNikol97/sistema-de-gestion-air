<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Votaciones - AIR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f5f7fb;
        }
        .votacion-card {
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            overflow: hidden;
        }
        .votacion-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px;
        }
        .votacion-body {
            padding: 25px;
            background: white;
        }
        .resultado-aprobado {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            display: inline-block;
        }
        .resultado-rechazado {
            background-color: #dc3545;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            display: inline-block;
        }
        .resultado-pendiente {
            background-color: #ffc107;
            color: #333;
            padding: 10px 20px;
            border-radius: 30px;
            display: inline-block;
        }
        .badge-mayoria {
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 20px;
        }
        .badge-simple {
            background-color: #17a2b8;
            color: white;
        }
        .badge-calificada {
            background-color: #fd7e14;
            color: white;
        }
        .voto-btn {
            padding: 5px 12px;
            margin: 0 3px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .voto-favor-btn {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #28a745;
        }
        .voto-favor-btn:hover, .voto-favor-btn.selected {
            background-color: #28a745;
            color: white;
        }
        .voto-contra-btn {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #dc3545;
        }
        .voto-contra-btn:hover, .voto-contra-btn.selected {
            background-color: #dc3545;
            color: white;
        }
        .voto-abstencion-btn {
            background-color: #e2e3e5;
            color: #383d41;
            border: 1px solid #6c757d;
        }
        .voto-abstencion-btn:hover, .voto-abstencion-btn.selected {
            background-color: #6c757d;
            color: white;
        }
        .voto-pendiente {
            color: #ffc107;
            font-style: italic;
        }
        .voto-emitido-favor {
            color: #28a745;
            font-weight: bold;
        }
        .voto-emitido-contra {
            color: #dc3545;
            font-weight: bold;
        }
        .voto-emitido-abstencion {
            color: #6c757d;
            font-weight: bold;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 50px;
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="fas fa-vote-yea me-2"></i>Tablero de Votaciones</h1>
        </div>

        <!-- Selector de Sesión y Propuesta -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-5 mb-3">
                        <label class="form-label fw-bold"><i class="fas fa-calendar-alt me-1"></i> Sesión</label>
                        <select id="sesion-select" class="form-select">
                            <option value="">-- Seleccionar sesión --</option>
                            <option value="1">Sesión Ordinaria AIR-01-2025 - 15/01/2025</option>
                            <option value="2">Sesión Extraordinaria AIR-02-2025 - 28/01/2025</option>
                        </select>
                    </div>
                    <div class="col-md-5 mb-3">
                        <label class="form-label fw-bold"><i class="fas fa-file-alt me-1"></i> Propuesta / Moción</label>
                        <select id="propuesta-select" class="form-select">
                            <option value="">-- Primero seleccione una sesión --</option>
                        </select>
                    </div>
                    <div class="col-md-2 mb-3 d-flex align-items-end">
                        <button id="btn-cargar" class="btn btn-primary w-100">
                            <i class="fas fa-search me-1"></i> Cargar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Cargando información...</p>
        </div>

        <!-- Panel de Votación -->
        <div id="votacion-panel" style="display: none;">
            <div class="votacion-card">
                <div class="votacion-header">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h3 id="propuesta-titulo" class="mb-1">-</h3>
                            <small id="propuesta-descripcion">-</small>
                        </div>
                        <div class="col-md-4 text-md-end">
                            <span id="mayoria-badge" class="badge-mayoria">-</span>
                        </div>
                    </div>
                </div>
                <div class="votacion-body">
                    <!-- Contadores -->
                    <div class="row text-center mb-4">
                        <div class="col-md-3">
                            <div class="border rounded p-3">
                                <small class="text-muted">Total Asambleístas</small>
                                <h2 id="total-count" class="mb-0">0</h2>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="border rounded p-3">
                                <small class="text-muted">Votos Favor</small>
                                <h2 id="favor-count" class="mb-0 text-success">0</h2>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="border rounded p-3">
                                <small class="text-muted">Votos Contra</small>
                                <h2 id="contra-count" class="mb-0 text-danger">0</h2>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="border rounded p-3">
                                <small class="text-muted">Abstenciones</small>
                                <h2 id="abstencion-count" class="mb-0 text-warning">0</h2>
                            </div>
                        </div>
                    </div>

                    <!-- Resultado -->
                    <div class="text-center mb-4" id="resultado-container">
                        <span id="resultado-badge" class="resultado-pendiente">
                            <i class="fas fa-hourglass-half me-1"></i> Pendiente de votación
                        </span>
                    </div>

                    <!-- Botones de acción -->
                    <div class="text-center mb-4">
                        <button class="btn btn-danger" onclick="finalizarVotacion()" id="btn-finalizar">
                            <i class="fas fa-check-circle me-2"></i> Finalizar Votación
                        </button>
                        <button class="btn btn-secondary ms-2" onclick="reiniciarVotacion()">
                            <i class="fas fa-undo me-2"></i> Reiniciar Votación
                        </button>
                    </div>
                </div>
            </div>

            <!-- Detalle de votos por asambleísta (votación individual) -->
            <div class="card">
                <div class="card-header bg-white fw-bold">
                    <i class="fas fa-users me-1"></i> Registro de Votación Individual
                    <small class="text-muted ms-2">(Cada asambleísta debe emitir su voto)</small>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Asambleísta</th>
                                    <th>Sector</th>
                                    <th colspan="3" class="text-center">Voto</th>
                                    <th>Estado</th>
                                </tr>
                                <tr class="table-secondary">
                                    <th colspan="3"></th>
                                    <th class="text-center text-success" style="width:80px">A Favor</th>
                                    <th class="text-center text-danger" style="width:80px">En Contra</th>
                                    <th class="text-center text-warning" style="width:80px">Abstención</th>
                                    <th style="width:100px"></th>
                                </tr>
                            </thead>
                            <tbody id="votos-detalle-tbody">
                                <!-- Se llena dinámicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPropuesta = null;
        let currentSesionId = null;
        let votos = { favor: 0, contra: 0, abstencion: 0 };
        let votosAsambleistas = {};  // { asambleista_id: 'favor' | 'contra' | 'abstencion' | null }

        const asambleistasMock = [
            { id: 1, nombre: "Ana María Rodríguez Mora", sector: "Docencia" },
            { id: 2, nombre: "Carlos Jiménez Solano", sector: "Administración" },
            { id: 3, nombre: "María Fernanda Vargas", sector: "Estudiantil" },
            { id: 4, nombre: "Luis Gómez Gutiérrez", sector: "Docencia" },
            { id: 5, nombre: "Rosa Fernández Pérez", sector: "Administración" }
        ];

        const propuestasMock = {
            1: [
                { id: 1, titulo: "Reforma al Artículo 5 del Estatuto Orgánico", descripcion: "Modificación del quórum para sesiones extraordinarias", tipo_mayoria: "calificada", requiere_66: true },
                { id: 2, titulo: "Aprobación de Políticas Generales 2025-2030", descripcion: "Nuevas directrices institucionales", tipo_mayoria: "simple", requiere_66: false }
            ],
            2: [
                { id: 3, titulo: "Creación de Comisión de Ética", descripcion: "Propuesta para establecer comisión permanente", tipo_mayoria: "simple", requiere_66: false },
                { id: 4, titulo: "Reforma al Reglamento de Carrera Docente", descripcion: "Actualización de criterios de evaluación", tipo_mayoria: "calificada", requiere_66: true }
            ]
        };

        function loadSharedComponents() {
            document.getElementById('navbar-placeholder').innerHTML = `
                <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                    <div class="container">
                        <a class="navbar-brand" href="#"><i class="fas fa-gavel me-2"></i>AIR - Sistema Legislativo</a>
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarNav">
                            <ul class="navbar-nav ms-auto">
                                <li class="nav-item"><a class="nav-link" href="/asambleistas">Asambleístas</a></li>
                                <li class="nav-item"><a class="nav-link" href="/normativa/arbol">Normativa</a></li>
                                <li class="nav-item"><a class="nav-link active" href="/sesiones">Sesiones</a></li>
                                <li class="nav-item"><a class="nav-link" href="/certificaciones">Certificaciones</a></li>
                            </ul>
                        </div>
                    </div>
                </nav>
            `;
            document.getElementById('footer-placeholder').innerHTML = `
                <footer class="text-center text-muted py-3 mt-4 border-top">
                    <small>Asamblea Institucional Representativa - TEC | Sistema de Gestión Legislativa</small>
                </footer>
            `;
        }

        document.getElementById('sesion-select').addEventListener('change', function() {
            const sesionId = this.value;
            currentSesionId = sesionId;
            const propuestaSelect = document.getElementById('propuesta-select');
            propuestaSelect.innerHTML = '<option value="">-- Seleccionar propuesta --</option>';
            
            if (sesionId && propuestasMock[sesionId]) {
                propuestasMock[sesionId].forEach(p => {
                    propuestaSelect.innerHTML += `<option value="${p.id}">${p.titulo}</option>`;
                });
            }
        });

        document.getElementById('btn-cargar').addEventListener('click', function() {
            const sesionId = document.getElementById('sesion-select').value;
            const propuestaId = document.getElementById('propuesta-select').value;
            
            if (!sesionId || !propuestaId) {
                alert('Seleccione una sesión y una propuesta');
                return;
            }
            
            const propuesta = propuestasMock[sesionId]?.find(p => p.id == propuestaId);
            if (propuesta) {
                currentPropuesta = propuesta;
                cargarVotacion(propuesta);
            }
        });

        function cargarVotacion(propuesta) {
            document.getElementById('loading').style.display = 'block';
            
            setTimeout(() => {
                document.getElementById('propuesta-titulo').innerText = propuesta.titulo;
                document.getElementById('propuesta-descripcion').innerText = propuesta.descripcion;
                document.getElementById('total-count').innerText = asambleistasMock.length;
                
                const mayoriaBadge = document.getElementById('mayoria-badge');
                if (propuesta.tipo_mayoria === 'calificada') {
                    mayoriaBadge.className = 'badge-mayoria badge-calificada';
                    mayoriaBadge.innerHTML = '<i class="fas fa-chart-line me-1"></i> Mayoría Calificada (66% de votos válidos)';
                } else {
                    mayoriaBadge.className = 'badge-mayoria badge-simple';
                    mayoriaBadge.innerHTML = '<i class="fas fa-chart-simple me-1"></i> Mayoría Simple (más Favor que Contra)';
                }
                
                reiniciarVotacion();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('votacion-panel').style.display = 'block';
            }, 300);
        }

        function registrarVoto(asambleistaId, tipoVoto) {
            // Si ya había un voto, lo restamos del contador
            const votoAnterior = votosAsambleistas[asambleistaId];
            if (votoAnterior) {
                votos[votoAnterior]--;
            }
            
            // Registrar el nuevo voto
            votosAsambleistas[asambleistaId] = tipoVoto;
            votos[tipoVoto]++;
            
            // Actualizar interfaz
            actualizarContadores();
            actualizarFilaVoto(asambleistaId, tipoVoto);
            calcularResultado();
        }

        function actualizarContadores() {
            document.getElementById('favor-count').innerText = votos.favor;
            document.getElementById('contra-count').innerText = votos.contra;
            document.getElementById('abstencion-count').innerText = votos.abstencion;
        }

        function calcularResultado() {
            const totalEmitidos = votos.favor + votos.contra + votos.abstencion;
            const resultadoSpan = document.getElementById('resultado-badge');
            
            if (totalEmitidos < asambleistasMock.length) {
                resultadoSpan.className = 'resultado-pendiente';
                resultadoSpan.innerHTML = `<i class="fas fa-hourglass-half me-1"></i> Pendiente - Faltan ${asambleistasMock.length - totalEmitidos} asambleísta(s) por votar`;
                return;
            }
            
            let aprobado = false;
            
            if (currentPropuesta?.tipo_mayoria === 'calificada') {
                // Mayoría calificada: 66% de los votos emitidos (excluyendo abstenciones)
                const votosValidos = votos.favor + votos.contra;
                if (votosValidos > 0) {
                    const porcentajeFavor = votos.favor / votosValidos;
                    aprobado = porcentajeFavor >= 0.66;
                }
            } else {
                // Mayoría simple: más votos a favor que en contra
                aprobado = votos.favor > votos.contra;
            }
            
            if (aprobado) {
                resultadoSpan.className = 'resultado-aprobado';
                resultadoSpan.innerHTML = '<i class="fas fa-check-circle me-1"></i> APROBADA - La propuesta ha sido aprobada';
            } else {
                resultadoSpan.className = 'resultado-rechazado';
                resultadoSpan.innerHTML = '<i class="fas fa-times-circle me-1"></i> RECHAZADA - La propuesta no alcanzó los votos necesarios';
            }
        }

        function actualizarFilaVoto(asambleistaId, tipoVoto) {
            const row = document.querySelector(`tr[data-id="${asambleistaId}"]`);
            if (row) {
                // Actualizar estado
                const estadoSpan = row.querySelector('.estado-voto');
                
                if (tipoVoto === 'favor') {
                    estadoSpan.innerHTML = '<span class="voto-emitido-favor"><i class="fas fa-check-circle me-1"></i> Votó a favor</span>';
                } else if (tipoVoto === 'contra') {
                    estadoSpan.innerHTML = '<span class="voto-emitido-contra"><i class="fas fa-times-circle me-1"></i> Votó en contra</span>';
                } else {
                    estadoSpan.innerHTML = '<span class="voto-emitido-abstencion"><i class="fas fa-minus-circle me-1"></i> Se abstuvo</span>';
                }
            }
        }

        function cargarDetalleVotos() {
            const tbody = document.getElementById('votos-detalle-tbody');
            tbody.innerHTML = '';
            
            asambleistasMock.forEach(a => {
                const votoActual = votosAsambleistas[a.id];
                
                const row = tbody.insertRow();
                row.setAttribute('data-id', a.id);
                row.insertCell(0).innerText = a.id;
                row.insertCell(1).innerText = a.nombre;
                row.insertCell(2).innerText = a.sector;
                
                // Botón A Favor
                const celFavor = row.insertCell(3);
                const btnFavor = document.createElement('button');
                btnFavor.className = `voto-btn voto-favor-btn ${votoActual === 'favor' ? 'selected' : ''}`;
                btnFavor.innerHTML = '<i class="fas fa-thumbs-up me-1"></i> Favor';
                btnFavor.onclick = () => registrarVoto(a.id, 'favor');
                celFavor.appendChild(btnFavor);
                celFavor.className = 'text-center';
                
                // Botón En Contra
                const celContra = row.insertCell(4);
                const btnContra = document.createElement('button');
                btnContra.className = `voto-btn voto-contra-btn ${votoActual === 'contra' ? 'selected' : ''}`;
                btnContra.innerHTML = '<i class="fas fa-thumbs-down me-1"></i> Contra';
                btnContra.onclick = () => registrarVoto(a.id, 'contra');
                celContra.appendChild(btnContra);
                celContra.className = 'text-center';
                
                // Botón Abstención
                const celAbstencion = row.insertCell(5);
                const btnAbstencion = document.createElement('button');
                btnAbstencion.className = `voto-btn voto-abstencion-btn ${votoActual === 'abstencion' ? 'selected' : ''}`;
                btnAbstencion.innerHTML = '<i class="fas fa-meh me-1"></i> Abstención';
                btnAbstencion.onclick = () => registrarVoto(a.id, 'abstencion');
                celAbstencion.appendChild(btnAbstencion);
                celAbstencion.className = 'text-center';
                
                // Estado
                const celEstado = row.insertCell(6);
                let estadoHtml = '';
                if (!votoActual) {
                    estadoHtml = '<span class="voto-pendiente"><i class="fas fa-clock me-1"></i> Pendiente</span>';
                } else if (votoActual === 'favor') {
                    estadoHtml = '<span class="voto-emitido-favor"><i class="fas fa-check-circle me-1"></i> Votó a favor</span>';
                } else if (votoActual === 'contra') {
                    estadoHtml = '<span class="voto-emitido-contra"><i class="fas fa-times-circle me-1"></i> Votó en contra</span>';
                } else {
                    estadoHtml = '<span class="voto-emitido-abstencion"><i class="fas fa-minus-circle me-1"></i> Se abstuvo</span>';
                }
                celEstado.innerHTML = estadoHtml;
                celEstado.className = 'estado-voto';
            });
        }

        function finalizarVotacion() {
            const totalEmitidos = votos.favor + votos.contra + votos.abstencion;
            
            if (totalEmitidos < asambleistasMock.length) {
                alert(`⚠️ No se puede finalizar. Faltan ${asambleistasMock.length - totalEmitidos} asambleísta(s) por votar.`);
                return;
            }
            
            const resultadoSpan = document.getElementById('resultado-badge');
            const esAprobada = resultadoSpan.classList.contains('resultado-aprobado');
            
            alert(`✅ VOTACIÓN FINALIZADA\n\nPropuesta: ${currentPropuesta?.titulo}\n\nResultado: ${esAprobada ? 'APROBADA' : 'RECHAZADA'}\n\nVotos a favor: ${votos.favor}\nVotos en contra: ${votos.contra}\nAbstenciones: ${votos.abstencion}\n\nTotal votos emitidos: ${totalEmitidos}`);
        }

        function reiniciarVotacion() {
            votos = { favor: 0, contra: 0, abstencion: 0 };
            votosAsambleistas = {};
            
            asambleistasMock.forEach(a => {
                votosAsambleistas[a.id] = null;
            });
            
            actualizarContadores();
            cargarDetalleVotos();
            
            const resultadoSpan = document.getElementById('resultado-badge');
            resultadoSpan.className = 'resultado-pendiente';
            resultadoSpan.innerHTML = `<i class="fas fa-hourglass-half me-1"></i> Pendiente - Faltan ${asambleistasMock.length} asambleísta(s) por votar`;
        }

        loadSharedComponents();
    </script>
</body>
</html>
