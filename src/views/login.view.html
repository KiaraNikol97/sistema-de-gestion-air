<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema AIR</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 24px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #3d8fe0; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #3d8fe0; }
        .error-msg { color: rgb(228, 25, 150); font-size: 14px; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Sistema Gestión Legislative AIR</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Usuario:</label>
            <input type="text" id="username" required>
        </div>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">Iniciar Sesión</button>
        <div id="error" class="error-msg">Credenciales incorrectas, intente de nuevo.</div>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error');

        try {
            // Conecta con el AuthController que hiciste en el backend
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Guarda el token JWT de forma segura en el navegador
                localStorage.setItem('token', data.token);
                //redirige a la pantalla interna principal
                window.location.href = '/views/dashboard.view.html';
            } else {
                errorDiv.innerText = data.message || 'Error al iniciar sesión';
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            errorDiv.innerText = 'Error de conexión con el servidor';
            errorDiv.style.display = 'block';
        } //La mayoría de este código fue generado mediante inteligencia artifical ya que las integrantes de este grupo no manejan HTML
    });
</script>

</body>
</html>
