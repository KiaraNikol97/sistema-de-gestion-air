<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Asambleístas</title>
</head>
<body>

    <h1>Gestión de Asambleístas</h1>

    <!-- Formulario de registro -->
    <h2>Registrar asambleísta</h2>

    <form action="/asambleistas/registrar" method="POST">

        <label for="nombre">Nombre completo:</label>
        <br>
        <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            required
        >
        <br><br>

        <label for="cedula">Cédula:</label>
        <br>
        <input 
            type="text" 
            id="cedula" 
            name="cedula" 
            placeholder="0-0000-0000"
            required
        >
        <br><br>

        <label for="correo">Correo institucional:</label>
        <br>
        <input 
            type="email" 
            id="correo" 
            name="correo"
            placeholder="usuario@tec.ac.cr"
        >
        <br><br>

        <button type="submit">Registrar</button>

    </form>

    <hr>

    <!-- Buscador -->
    <h2>Buscar asambleístas</h2>

    <form action="/asambleistas/buscar" method="GET">

        <label for="buscar">Buscar por nombre o cédula:</label>
        <br>
        <input 
            type="text" 
            id="buscar" 
            name="buscar"
            placeholder="Ejemplo: Ana o 1-2345-6789"
        >

        <button type="submit">Buscar</button>

    </form>

    <hr>

    <!-- Listado -->
    <h2>Listado de asambleístas</h2>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Cédula</th>
                <th>Nombre completo</th>
                <th>Correo institucional</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <!-- 
                Aquí se cargarán los datos desde el controller.
                Ejemplo si luego usan EJS:
                
                <% asambleistas.forEach(function(asambleista) { %>
                    <tr>
                        <td><%= asambleista.id_asambleista %></td>
                        <td><%= asambleista.cedula %></td>
                        <td><%= asambleista.nombre %></td>
                        <td><%= asambleista.correo_institucional %></td>
                    </tr>
                <% }); %>
            -->

            <tr>
                <td>1</td>
                <td>1-2345-6789</td>
                <td>Ana María Rodríguez Mora</td>
                <td>arodriguez@tec.ac.cr</td>
                <td>
                    <button>Editar</button>
                    <button>Ver bitácora</button>
                </td>
            </tr>

            <tr>
                <td>2</td>
                <td>2-3456-7890</td>
                <td>Carlos Jiménez Solano</td>
                <td>cjimenez@tec.ac.cr</td>
                <td>
                    <button>Editar</button>
                    <button>Ver bitácora</button>
                </td>
            </tr>

        </tbody>
    </table>

    <hr>

    <!-- Formulario de edición -->
    <h2>Editar datos personales</h2>

    <form action="/asambleistas/editar" method="POST">

        <label for="id_asambleista">ID del asambleísta:</label>
        <br>
        <input 
            type="number" 
            id="id_asambleista" 
            name="id_asambleista" 
            required
        >
        <br><br>

        <label for="editar_nombre">Nuevo nombre completo:</label>
        <br>
        <input 
            type="text" 
            id="editar_nombre" 
            name="nombre" 
            required
        >
        <br><br>

        <label for="editar_cedula">Nueva cédula:</label>
        <br>
        <input 
            type="text" 
            id="editar_cedula" 
            name="cedula" 
            placeholder="0-0000-0000"
            required
        >
        <br><br>

        <label for="editar_correo">Nuevo correo institucional:</label>
        <br>
        <input 
            type="email" 
            id="editar_correo" 
            name="correo"
        >
        <br><br>

        <button type="submit">Guardar cambios</button>

    </form>

</body>
</html>
