<button id="logoutBtn" style="padding: 8px 15px; background-color: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer;">
    Cerrar Sesión
</button>

<script>
    // LÓGICA DE CIERRE DE SESIÓN (Requerimiento Issue 0)
    document.getElementById('logoutBtn').addEventListener('click', () => {
        // 1. Borra el token del navegador, quitándole el acceso de inmediato
        localStorage.removeItem('token');
        
        // 2. Redirige inmediatamente a la pantalla de login
        window.location.href = '/views/login.view.html';
    });

    // Seguridad extra: Si intentan entrar a esta pantalla sin login, los rebota
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/views/login.view.html';
    }
</script>
