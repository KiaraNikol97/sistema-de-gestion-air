
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Asambleístas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .badge-verde { background-color: green; color: white; padding: 3px 8px; border-radius: 5px; font-size: 12px; }
        .badge-gris { background-color: gray; color: white; padding: 3px 8px; border-radius: 5px; font-size: 12px; }
        .form-group { margin-bottom: 15px; }
        button { padding: 5px 10px; margin: 2px; cursor: pointer; }
        input, select { padding: 5px; width: 300px; }
        hr { margin: 20px 0; }
        .seccion { border: 1px solid #ccc; padding: 15px; margin: 20px 0; border-radius: 5px; }
    </style>
</head>
<body>

    <h1> Gestión de Asambleístas - AIR</h1>
    <a href="/asambleistas">← Volver al listado</a>

    <!-- ============================================= -->
    <!-- SECCIÓN 1: DATOS PERSONALES (Registro/Edición)-->
    <!-- ============================================= -->
    <div class="seccion">
        <h2 id="form-titulo">📝 Registrar asambleísta</h2>
        <form action="/asambleistas/guardar" method="POST" id="asambleista-form" onsubmit="return false;">
            <input type="hidden" id="asambleista_id" name="asambleista_id">
            
            <div class="form-group">
                <label>Nombre completo:</label><br>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            
            <div class="form-group">
                <label>Cédula:</label><br>
                <input type="text" id="cedula" name="cedula" placeholder="0-0000-0000" required>
            </div>
            
            <div class="form-group">
                <label>Correo institucional:</label><br>
                <input type="email" id="correo" name="correo" placeholder="usuario@tec.ac.cr">
            </div>
            
            <button type="button" id="btn-submit" onclick="guardarAsambleista()">Registrar</button>
            <button type="button" id="btn-cancelar" style="display:none;" onclick="cancelarEdicion()">Cancelar</button>
        </form>
    </div>

    <!-- ============================================= -->
    <!-- SECCIÓN 2: NOMBRAMIENTOS (Requisito #3 y #7)  -->
    <!-- ============================================= -->
    <div class="seccion" id="nombramientos-section" style="display:none;">
        <h2>📌 Gestión de nombramientos</h2>
        <input type="hidden" id="nombramiento_asambleista_id">
        
        <h3>Nombramientos actuales</h3>
        <table border="1" cellpadding="8" style="width:100%">
            <thead>
                <tr><th>Sector</th><th>Puesto</th><th>Fecha Inicio</th><th>Fecha Fin</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody id="nombramientos-lista">
                <tr><td colspan="6">Seleccione un asambleísta para ver sus nombramientos</td></tr>
            </tbody>
        </table>

        <hr>

        <h3> + Agregar nuevo nombramiento</h3>
        <div class="form-group">
            <label>Sector:</label><br>
            <select id="nombramiento_sector">
                <option value="">-- Seleccione --</option>
                <option value="1">Docencia</option>
                <option value="2">Administración</option>
                <option value="3">Estudiantil</option>
                <option value="4">Sector Oficio</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Puesto:</label><br>
            <select id="nombramiento_puesto">
                <option value="">-- Seleccione --</option>
                <option value="1">Representante Propietario</option>
                <option value="2">Representante Suplente</option>
                <option value="3">Secretaría</option>
                <option value="4">Directorio</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Fecha inicio:</label><br>
            <input type="date" id="nombramiento_fecha_inicio">
        </div>
        
        <div class="form-group">
            <label>Fecha fin (dejar vacío si es vigente):</label><br>
            <input type="date" id="nombramiento_fecha_fin">
        </div>
        
        <button onclick="agregarNombramiento()">Agregar nombramiento</button>
    </div>

    <script>
        // Datos de ejemplo (esto vendrá del controlador en el backend real)
        let asambleistasData = [
            { id: 1, cedula: "1-2345-6789", nombre: "Ana María Rodríguez Mora", correo: "arodriguez@tec.ac.cr" },
            { id: 2, cedula: "2-3456-7890", nombre: "Carlos Jiménez Solano", correo: "cjimenez@tec.ac.cr" },
            { id: 3, cedula: "3-4567-8901", nombre: "María Fernanda Vargas", correo: "mvargas@tec.ac.cr" }
        ];
        
        let nombramientosData = {
            1: [{ sector: "Docencia", puesto: "Representante Propietario", fecha_inicio: "2023-01-15", fecha_fin: null, estado: "VIGENTE" }],
            2: [{ sector: "Administración", puesto: "Representante Suplente", fecha_inicio: "2022-03-10", fecha_fin: "2024-12-31", estado: "HISTÓRICO" }],
            3: [{ sector: "Estudiantil", puesto: "Representante Propietario", fecha_inicio: "2024-01-20", fecha_fin: null, estado: "VIGENTE" }]
        };
        
        // Detectar si es edición por la URL o parámetros
        function obtenerIdDeURL() {
            // Simulación: en el backend real se pasa el ID
            // Por ahora, mostramos un selector para pruebas
            let params = new URLSearchParams(window.location.search);
            return params.get('id');
        }
        
        function cargarAsambleistaParaEdicion(id) {
            let asambleista = asambleistasData.find(a => a.id == id);
            if(asambleista) {
                document.getElementById('form-titulo').innerText = '✏️ Editar asambleísta';
                document.getElementById('asambleista_id').value = asambleista.id;
                document.getElementById('nombre').value = asambleista.nombre;
                document.getElementById('cedula').value = asambleista.cedula;
                document.getElementById('correo').value = asambleista.correo;
                document.getElementById('btn-submit').innerText = 'Actualizar';
                document.getElementById('btn-cancelar').style.display = 'inline-block';
                document.getElementById('nombramientos-section').style.display = 'block';
                document.getElementById('nombramiento_asambleista_id').value = asambleista.id;
                mostrarNombramientos(asambleista.id);
            }
        }
        
        function mostrarNombramientos(asambleistaId) {
            let tbody = document.getElementById('nombramientos-lista');
            let nombramientos = nombramientosData[asambleistaId] || [];
            
            if(nombramientos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">No hay nombramientos registrados</td></tr>';
                return;
            }
            
            tbody.innerHTML = '';
            nombramientos.forEach((n, index) => {
                let row = tbody.insertRow();
                row.insertCell(0).innerText = n.sector;
                row.insertCell(1).innerText = n.puesto;
                row.insertCell(2).innerText = n.fecha_inicio;
                row.insertCell(3).innerText = n.fecha_fin || 'Actual';
                row.insertCell(4).innerHTML = n.estado === 'VIGENTE' ? 
                    '<span class="badge-verde">VIGENTE</span>' : 
                    '<span class="badge-gris">HISTÓRICO</span>';
                row.insertCell(5).innerHTML = `<button onclick="eliminarNombramiento(${asambleistaId}, ${index})">🗑️</button>`;
            });
        }
        
        function eliminarNombramiento(asambleistaId, index) {
            if(confirm('¿Eliminar este nombramiento?')) {
                nombramientosData[asambleistaId].splice(index, 1);
                mostrarNombramientos(asambleistaId);
                alert('Nombramiento eliminado');
            }
        }
        
        function guardarAsambleista() {
            let id = document.getElementById('asambleista_id').value;
            let nombre = document.getElementById('nombre').value;
            let cedula = document.getElementById('cedula').value;
            let correo = document.getElementById('correo').value;
            
            if(!nombre || !cedula) {
                alert('Nombre y cédula son obligatorios');
                return;
            }
            
            if(id) {
                let index = asambleistasData.findIndex(a => a.id == id);
                if(index !== -1) {
                    asambleistasData[index] = { ...asambleistasData[index], nombre, cedula, correo };
                    alert(`Asambleísta actualizado: ${nombre}`);
                }
            } else {
                let nuevoId = asambleistasData.length + 1;
                asambleistasData.push({ id: nuevoId, cedula, nombre, correo });
                alert(`Asambleísta registrado: ${nombre}`);
                window.location.href = '/asambleistas';
            }
            cancelarEdicion();
        }
        
        function cancelarEdicion() {
            window.location.href = '/asambleistas';
        }
        
        function agregarNombramiento() {
            let asambleistaId = document.getElementById('nombramiento_asambleista_id').value;
            let sectorSelect = document.getElementById('nombramiento_sector');
            let puestoSelect = document.getElementById('nombramiento_puesto');
            let sector = sectorSelect.options[sectorSelect.selectedIndex]?.text;
            let puesto = puestoSelect.options[puestoSelect.selectedIndex]?.text;
            let fecha_inicio = document.getElementById('nombramiento_fecha_inicio').value;
            let fecha_fin = document.getElementById('nombramiento_fecha_fin').value || null;
            
            if(!sector || !puesto || !fecha_inicio) {
                alert('Por favor complete sector, puesto y fecha de inicio');
                return;
            }
            
            // Validar que no haya traslape de fechas
            let nombramientosExistentes = nombramientosData[asambleistaId] || [];
            let hayTraslape = nombramientosExistentes.some(n => {
                if(n.estado === 'HISTÓRICO' && fecha_fin) {
                    return (fecha_inicio <= n.fecha_fin && (!fecha_fin || fecha_fin >= n.fecha_inicio));
                }
                return false;
            });
            
            if(hayTraslape) {
                alert('Error: Las fechas del nuevo nombramiento se traslapan con uno existente');
                return;
            }
            
            if(!nombramientosData[asambleistaId]) nombramientosData[asambleistaId] = [];
            
            nombramientosData[asambleistaId].push({
                sector, puesto, fecha_inicio, fecha_fin,
                estado: fecha_fin ? 'HISTÓRICO' : 'VIGENTE'
            });
            
            alert('Nombramiento agregado correctamente');
            document.getElementById('nombramiento_sector').value = '';
            document.getElementById('nombramiento_puesto').value = '';
            document.getElementById('nombramiento_fecha_inicio').value = '';
            document.getElementById('nombramiento_fecha_fin').value = '';
            mostrarNombramientos(asambleistaId);
        }
        
        // Cargar si es edición
        let idEditar = obtenerIdDeURL();
        if(idEditar) {
            cargarAsambleistaParaEdicion(parseInt(idEditar));
        }
    </script>
</body>
</html>
