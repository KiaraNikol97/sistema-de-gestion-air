<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba - Botón</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <h1>🧪 Prueba del Botón</h1>
        <p>Haz clic en el botón para ver si funciona</p>
        
        <!-- BOTÓN DE PRUEBA -->
        <button id="btn-consultar" class="btn btn-primary">
            Consultar Atestados
        </button>
        
        <button class="btn btn-secondary" onclick="console.log('📝 Mensaje en consola')">
            Probar consola
        </button>
        
        <div id="resultado" class="mt-3">
            <p>Esperando clic...</p>
        </div>
    </div>

    <script>
        // Función que se ejecuta al cargar la página
        console.log('✅ El script se está ejecutando');
        
        const boton = document.getElementById('btn-consultar');
        console.log('🔍 Botón encontrado:', boton);
        
        if (boton) {
            boton.addEventListener('click', function() {
                alert('✅ El botón funciona!');
                document.getElementById('resultado').innerHTML = '<div class="alert alert-success">✅ El botón funcionó correctamente!</div>';
            });
        } else {
            console.error('❌ No se encontró el botón');
        }
    </script>
</body>
</html>
