<script>
    // =====================================================
    // PRUEBA - BOTÓN CON ALERT
    // =====================================================
    
    // Esta función se ejecuta cuando la página carga
    document.addEventListener('DOMContentLoaded', function() {
        console.log('✅ La página ha cargado correctamente');
        
        // Buscar el botón por su ID
        const boton = document.getElementById('btn-consultar');
        console.log('🔍 Botón encontrado:', boton);
        
        if (boton) {
            // Agregar un evento click al botón
            boton.addEventListener('click', function() {
                alert('✅ El botón funciona! Haz clic en OK para continuar.');
                console.log('✅ El botón fue clickeado');
                
                // Aquí puedes poner el resto del código
            });
        } else {
            console.error('❌ No se encontró el botón con id "btn-consultar"');
        }
    });
</script>
